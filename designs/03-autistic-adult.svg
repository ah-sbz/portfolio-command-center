<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4500 5400" width="4500" height="5400">
  <rect width="4500" height="5400" fill="#F8F6F3"/>
  <text x="2250" y="2100" font-family="Impact, Arial Black, sans-serif" font-size="360" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle" letter-spacing="20">AUTISTIC</text>
  <text x="2250" y="2600" font-family="Impact, Arial Black, sans-serif" font-size="360" fill="#FFD700" text-anchor="middle" dominant-baseline="middle" letter-spacing="20">ADULT</text>
  <text x="2250" y="3050" font-family="Helvetica, Arial, sans-serif" font-size="80" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle">Not broken. Not missing.</text>
  <text x="2250" y="3160" font-family="Helvetica, Arial, sans-serif" font-size="80" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle">Just wired differently.</text>
  <text x="2250" y="3310" font-family="Helvetica, Arial, sans-serif" font-size="60" fill="#6B5B95" text-anchor="middle" dominant-baseline="middle">Identity-first language. Neurodivergent pride.</text>
</svg>