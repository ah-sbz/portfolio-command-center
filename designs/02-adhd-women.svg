<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4500 5400" width="4500" height="5400">
  <rect width="4500" height="5400" fill="#F8F6F3"/>
  <text x="2250" y="2100" font-family="Impact, Arial Black, sans-serif" font-size="380" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle" letter-spacing="25">ADHD</text>
  <text x="2250" y="2600" font-family="Impact, Arial Black, sans-serif" font-size="380" fill="#6B5B95" text-anchor="middle" dominant-baseline="middle" letter-spacing="25">WOMEN</text>
  <text x="2250" y="3050" font-family="Helvetica, Arial, sans-serif" font-size="72" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle">We see what others miss.</text>
  <text x="2250" y="3150" font-family="Helvetica, Arial, sans-serif" font-size="72" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle">We feel what others ignore.</text>
  <text x="2250" y="3250" font-family="Helvetica, Arial, sans-serif" font-size="72" fill="#2D2D2D" text-anchor="middle" dominant-baseline="middle">We are not too much.</text>
